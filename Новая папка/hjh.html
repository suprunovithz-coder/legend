<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Легенды ECRU</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 40px; }
  h1 { text-align: center; margin-bottom: 30px; }
  .gallery { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
  .card { background: white; padding: 10px; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); width: 250px; text-align: center; }
  .card img { width: 100%; height: 300px; object-fit: cover; border-radius: 5px; }
  .card-name { font-size: 20px; font-weight: bold; margin-top: 10px; }
  
  /* Модальное окно */
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
  .modal.active { display: flex; }
  .modal-content { background: white; padding: 20px; border-radius: 10px; max-width: 500px; width: 90%; position: relative; }
  .modal-content img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 5px; margin-bottom: 15px; }
  .close-btn { position: absolute; top: 10px; right: 15px; font-size: 30px; cursor: pointer; color: red; }
</style>
</head>
<body>

<h1>Легенды ECRU</h1>

<div class="gallery">
  <div class="card" onclick="openModal('lelia')">
    <img src="1.jpg" alt="Леля">
    <div class="card-name">Леля</div>
  </div>
  <div class="card" onclick="openModal('diana')">
    <img src="2.jpg" alt="Дяна">
    <div class="card-name">Дяна</div>
  </div>
  <div class="card" onclick="openModal('zhylia')">
    <img src="3.jpg" alt="Жуля">
    <div class="card-name">Жуля</div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <img id="modal-img" src="" alt="">
    <h2 id="modal-name"></h2>
    <p id="modal-info"></p>
  </div>
</div>

<script>
  var girls = {
    lelia: { name: "Леля", img: "5.jpg", info: "Текст про Лелю." },
    diana: { name: "Дяна", img: "6.jpg", info: "Текст про Дяну." },
    zhylia: { name: "Жуля", img: "4.jpg", info: "Текст про Жулю." }
  };

  function openModal(id) {
    var girl = girls[id];
    if (!girl) return;
    
    document.getElementById('modal-img').src = girl.img;
    document.getElementById('modal-name').textContent = girl.name;
    document.getElementById('modal-info').textContent = girl.info;
    document.getElementById('modal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('active');
  }

  document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target.id === 'modal') closeModal();
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Легенды ECRU</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; padding: 40px 20px; }
  h1 { text-align: center; color: #333; margin-bottom: 40px; font-size: 2.5em; }
  
  .gallery { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; max-width: 1200px; margin: 0 auto; }
  
  .card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; width: 280px; }
  .card:hover { transform: translateY(-10px); box-shadow: 0 8px 25px rgba(0,0,0,0.2); }
  
  .card img { width: 100%; height: 350px; object-fit: cover; display: block; }
  .card-name { padding: 15px; text-align: center; font-size: 1.3em; font-weight: bold; color: #444; }
  
  /* Модальное окно */
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
  .modal.active { display: flex; }
  
  .modal-content { background: white; border-radius: 15px; max-width: 500px; width: 100%; padding: 30px; position: relative; animation: fadeIn 0.3s; }
  
  /* Исправлено: убрал мусор из тега */
  @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
  
  .modal-content img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 10px; margin-bottom: 20px; }
  .modal-content h2 { color: #333; margin-bottom: 15px; }
  .modal-content p { color: #666; line-height: 1.6; font-size: 1.05em; }
  
  .close-btn { position: absolute; top: 15px; right: 20px; font-size: 2em; cursor: pointer; color: #999; line-height: 1; }
  .close-btn:hover { color: #333; }
</style>
</head>
<body>

<h1>✨ Легенды ECRU ✨</h1>

<div class="gallery">
  <!-- Карточка 1 (Леля) -->
  <div class="card" onclick="openModal('lelia')">
    <img src="1.jpg" alt="Леля">
    <div class="card-name">Леди Салихова(p.s Леля)</div>
  </div>

  <!-- Карточка 2 (Дяна) -->
  <div class="card" onclick="openModal('diana')">
    <img src="2.jpg" alt="Дяна">
    <div class="card-name">Дяна Бог(p.s Буся)</div>
  </div>

  <!-- Карточка 3 (Жуля) -->
  <div class="card" onclick="openModal('zhylia')">
    <img src="3.jpg" alt="Жуля">
    <div class="card-name">МС Жуля</div>
  </div>
</div>

<!-- Модальное окно -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <img id="modal-img" src="" alt="">
    <h2 id="modal-name"></h2>
    <p id="modal-info"></p>
  </div>
</div>

<script>
  // Твои данные. 
  // ВАЖНО: Внутри текста info я заменил двойные кавычки на одинарные, чтобы код не ломался!
  const girls = {
    lelia: {

    },

      info: "Дяна Бог - Дяна бог в рвании тузов, но на самом деле она реально такая буся. Точно сдаст экзамен, если там будет задание 'спойте песню Династия наизусть'. На работе Диана королева рана."
    },
    zhylia: {
      name: "МС Жуля",
      img: "4.jpg", 
      info: "Рэп икона. Если спросят какой любимый мем без раздумий ответит сиксевен."
    }
  };

  function openModal(id) {
    const girl = girls[id];
    if (!girl) return;
    
    document.getElementById('modal-img').src = girl.img;
    document.getElementById('modal-name').textContent = girl.name;
    document.getElementById('modal-info').textContent = girl.info;
    
    document.getElementById('modal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove


'active');
  }

  // Закрытие при клике на фон (я перенес код на новую строку, как положено)

    if (e.target.id === 'modal') closeModal();
  });

  // Закрытие на Esc
  document.addEventListener('keydown', function(e) {

</script>

</body>
